[project]
name = "rag-101"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dilliram-code", email = "chaudharydr23@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.5",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "tiktoken>=0.14.0",
]

[project.scripts]
rag-101 = "rag_101:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
